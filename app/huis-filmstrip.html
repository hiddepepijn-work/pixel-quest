<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Quest – filmstrip loopcycli</title>
<script src="testindicator.js"></script>
<style>
  body { margin: 0; padding: 12px; background: #fdf6e6; font: 13px/1.3 Consolas, monospace; color: #0b1238; }
  h2 { font-size: 15px; margin: 14px 0 4px; }
  .rij { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; margin-bottom: 6px; }
  .cel { position: relative; background: #e9e1cf; overflow: hidden; }
  .cel.donker { background: #9fc3c6; }
  .cel canvas { position: absolute; image-rendering: pixelated; }
  .cel .grond { position: absolute; left: 0; right: 0; height: 1px; background: #d0342c; opacity: .7; }
  .cel .lijn { position: absolute; top: 0; bottom: 0; width: 1px; background: #2b6cb0; opacity: .6; }
  .cel .nr { position: absolute; left: 2px; top: 1px; font-size: 10px; opacity: .7; }
  .noot { opacity: .75; margin: 0 0 4px; }
</style>
<script src="../assets/manifest.js"></script>
<script src="../assets/kleding.js"></script>
<script src="../assets/huis.js"></script>
<script src="../assets/beweging.js"></script>
</head>
<body>
<h1 style="font-size:17px;margin:0">Filmstrip: procedurele loopcycli (huis-anim.js)</h1>
<p class="noot">Rood = grondlijn (anker). Rij "wereld": elk frame schuift het lichaam 1 artpx vooruit, zoals in het huis; de voet op de grond moet dan op de blauwe lijn blijven staan. ?zoom=4 (standaard), ?alleen=hidde,hondje.</p>
<div id="uit"></div>
<script src="../assets/kast.js"></script>
<script src="figuur.js"></script>
